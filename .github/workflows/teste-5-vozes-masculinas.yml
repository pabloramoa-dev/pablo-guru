name: Teste 5 vozes masculinas

on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-5-vozes-masculinas.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      SPEECH_KEY: ${{ secrets.SPEECH_KEY }}
      SPEECH_REGION: ${{ secrets.SPEECH_REGION }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar edge-tts
        run: pip install -q edge-tts==7.2.8
      - name: Gerar vozes para comparação
        run: |
          mkdir -p vozes
          python - <<'PY'
          import asyncio, html, os, urllib.request, urllib.error
          from pathlib import Path
          import edge_tts

          texto = '''Talvez você esteja esperando a vida dar um sinal.

Mas existe uma coisa que quase ninguém percebe...

Nem todo atraso significa que você ficou para trás.

Às vezes, o caminho apenas está preparando você para enxergar aquilo que antes passaria despercebido.

Então me responda: você está realmente atrasado... ou apenas vivendo o seu próprio tempo?'''

          vozes = {
              'humberto': 'pt-BR-HumbertoNeural',
              'nicolau': 'pt-BR-NicolauNeural',
              'macerio_hd': 'pt-BR-Macerio:DragonHDLatestNeural',
              'pedro_hd': 'pt-BR-Pedro:MAI-Voice-2',
              'rafael_hd': 'pt-BR-Rafael:MAI-Voice-2',
          }
          status=[]

          async def edge_one(nome, voz):
              destino=Path('vozes')/f'{nome}.mp3'
              try:
                  await edge_tts.Communicate(texto, voice=voz, rate='-6%').save(str(destino))
                  if destino.exists() and destino.stat().st_size > 1000:
                      status.append(f'{nome}|{voz}|edge|OK')
                      return True
              except Exception as e:
                  status.append(f'{nome}|{voz}|edge|FALHOU|{type(e).__name__}')
              destino.unlink(missing_ok=True)
              return False

          async def edge_all():
              for nome, voz in vozes.items():
                  await edge_one(nome, voz)
          asyncio.run(edge_all())

          key=os.getenv('AZURE_SPEECH_KEY') or os.getenv('SPEECH_KEY') or ''
          region=os.getenv('AZURE_SPEECH_REGION') or os.getenv('SPEECH_REGION') or ''
          if key and region:
              for nome, voz in vozes.items():
                  destino=Path('vozes')/f'{nome}.mp3'
                  if destino.exists():
                      continue
                  ssml=(f'<speak version="1.0" xml:lang="pt-BR"><voice name="{html.escape(voz)}">'
                        f'<prosody rate="-6%">{html.escape(texto)}</prosody></voice></speak>').encode('utf-8')
                  req=urllib.request.Request(
                      f'https://{region}.tts.speech.microsoft.com/cognitiveservices/v1',
                      data=ssml,
                      headers={
                          'Ocp-Apim-Subscription-Key': key,
                          'Content-Type': 'application/ssml+xml',
                          'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3',
                          'User-Agent': 'pablo-guru-voice-test',
                      }, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          data=r.read()
                      if len(data)>1000:
                          destino.write_bytes(data)
                          status.append(f'{nome}|{voz}|azure|OK')
                      else:
                          status.append(f'{nome}|{voz}|azure|FALHOU|audio_curto')
                  except Exception as e:
                      status.append(f'{nome}|{voz}|azure|FALHOU|{type(e).__name__}')
          else:
              status.append('azure|NAO_CONFIGURADO')

          Path('vozes/status.txt').write_text('\n'.join(status), encoding='utf-8')
          print('\n'.join(status))
          for p in Path('vozes').glob('*'):
              print(p.name, p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: comparacao-vozes-masculinas-hd
          path: vozes/
          retention-days: 7
          if-no-files-found: error
