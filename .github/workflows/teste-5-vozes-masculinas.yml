name: Teste Antonio Neural

on:
  push:
    branches: [main]
    paths: ['.github/workflows/teste-5-vozes-masculinas.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar edge-tts
        run: pip install -q edge-tts==7.2.8
      - name: Gerar Antonio
        run: |
          mkdir -p voz
          python - <<'PY'
          import asyncio
          import edge_tts

          texto = ('Talvez você esteja esperando a vida dar um sinal.\n\n'
                   'Mas existe uma coisa que quase ninguém percebe...\n\n'
                   'Nem todo atraso significa que você ficou para trás.\n\n'
                   'Às vezes, o caminho apenas está preparando você para enxergar aquilo que antes passaria despercebido.\n\n'
                   'Então me responda: você está realmente atrasado... ou apenas vivendo o seu próprio tempo?')

          asyncio.run(edge_tts.Communicate(
              texto,
              voice='pt-BR-AntonioNeural',
              rate='-6%'
          ).save('voz/antonio.mp3'))
          PY
          test -s voz/antonio.mp3
          ls -lh voz/antonio.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: antonio-neural
          path: voz/antonio.mp3
          retention-days: 7
          if-no-files-found: error
