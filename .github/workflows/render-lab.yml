name: Render Pablo Guru Pilot

on:
  push:
    branches: ["lab/pablo-guru-v3"]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config

      - name: Pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim==0.20.1 numpy scipy soundfile kokoro-onnx "misaki-fork[en]"

      - name: Syntax check
        run: |
          python -m compileall personagens cenarios audio lab

      - name: Generate complete pilot voice track
        env:
          PYTHONPATH: .
        run: python audio/generate_pilot_voice.py

      - name: Render complete pilot
        env:
          PYTHONPATH: .
        run: manim -ql --disable_caching lab/piloto_01.py PabloGuruPilot01

      - name: Collect pilot output
        run: |
          mkdir -p output
          find media/videos -name "PabloGuruPilot01.mp4" -print -exec cp {} output/pablo-guru-piloto-01.mp4 \;
          cp audio/generated/piloto_01.wav output/
          cp audio/generated/piloto_01_timings.json output/
          cp audio/generated/piloto_01_cues.json output/
          test -f output/pablo-guru-piloto-01.mp4

      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: pablo-guru-piloto-01
          path: output/*
          if-no-files-found: error
