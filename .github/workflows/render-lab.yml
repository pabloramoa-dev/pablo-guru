name: Render Pablo Guru Episodes

on:
  push:
    branches: ["lab/pablo-guru-v3"]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config

      - name: Pilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim==0.20.1 numpy scipy soundfile kokoro-onnx "misaki-fork[en]"

      - name: Syntax check
        run: |
          python -m compileall personagens cenarios audio estilo lab

      - name: Generate dual voice pilot track
        env:
          PYTHONPATH: .
        run: python audio/generate_pilot_voice.py

      - name: Generate A Estacao audio
        env:
          PYTHONPATH: .
        run: python episodios/a_estacao/generate_audio.py

      - name: Render V12 female questioner reel
        env:
          PYTHONPATH: .
        run: manim -ql --disable_caching lab/piloto_v12_final.py PabloGuruPilotV12Final

      - name: Render A Estacao reel
        env:
          PYTHONPATH: .
        run: manim -qh --disable_caching episodios/a_estacao/a_estacao.py PabloGuruAEstacao

      - name: Collect V12 output
        run: |
          mkdir -p output
          find media/videos -name "PabloGuruPilotV12Final.mp4" -print -exec cp {} output/pablo-guru-v12-dual-voice-final.mp4 \;
          cp audio/generated/piloto_01.wav output/
          cp audio/generated/piloto_01_timings.json output/
          cp audio/generated/piloto_01_cues.json output/
          cp audio/generated/piloto_01_asker_cues.json output/
          test -f output/pablo-guru-v12-dual-voice-final.mp4

      - name: Collect A Estacao output
        run: |
          find media/videos -name "PabloGuruAEstacao.mp4" -print -exec cp {} output/pablo-guru-a-estacao.mp4 \;
          cp audio/generated/a_estacao/a_estacao.wav output/
          cp audio/generated/a_estacao/timings.json output/a_estacao_timings.json
          cp audio/generated/a_estacao/pablo_cues.json output/a_estacao_pablo_cues.json
          cp audio/generated/a_estacao/asker_cues.json output/a_estacao_asker_cues.json
          test -f output/pablo-guru-a-estacao.mp4

      - name: Upload V12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pablo-guru-v12-dual-voice-final
          path: output/*
          if-no-files-found: error
