name: Render Pablo Guru V3 Lab

on:
  push:
    branches: ["lab/pablo-guru-v3"]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Visual lab dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim==0.20.1 numpy scipy

      - name: Syntax check
        run: |
          python -m compileall personagens cenarios audio lab

      - name: Render V3 character lab
        env:
          PYTHONPATH: .
        run: |
          manim -ql --disable_caching lab/render_personagem.py PabloGuruV3Lab

      - name: Render lip sync lab
        env:
          PYTHONPATH: .
        run: |
          manim -ql --disable_caching lab/render_lipsync.py PabloGuruLipSyncLab

      - name: Collect output
        run: |
          mkdir -p output
          find media/videos -name "*.mp4" -print -exec cp {} output/ \;

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: pablo-guru-v3-lab
          path: output/*.mp4
          if-no-files-found: error
