name: Pablo Guru Diario
on:
  schedule:
    - cron: "41 10 * * *"  # 07h41 em Brasília; minuto quebrado foge do pico do GitHub
  push:
    branches: [main, implementacao/episodios-diarios-direct]
    paths: ['daily/**', 'studio/**', 'video/**', 'audio/**', 'episodios/a_estacao/**', '.github/actions/setup-hyperframes/**', 'requirements.txt', '.github/workflows/diario.yml']
  workflow_dispatch:
    inputs:
      episode_date:
        description: 'Data editorial YYYY-MM-DD (vazio usa hoje em Brasília)'
        required: false
        type: string
      test:
        description: 'Gerar piloto sem consumir a data editorial'
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: pablo-diario-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Preparar HyperFrames
        uses: ./.github/actions/setup-hyperframes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg espeak-ng libcairo2-dev libpango1.0-dev pkg-config
          # Poppins: fonte da colagem e da legenda do estilo Vox
          mkdir -p ~/.fonts
          for f in Poppins-Bold Poppins-Regular; do
            curl -sL -o ~/.fonts/$f.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/$f.ttf"
          done
          fc-cache -f >/dev/null
          pip install "pillow>=10.4,<12" manim==0.21.0 numpy scipy soundfile kokoro-onnx requests cryptography edge-tts==7.2.8
      - name: Rhubarb oficial
        run: |
          curl -fL --retry 3 -o /tmp/rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip
          unzip -q /tmp/rhubarb.zip -d /tmp/pablo-rhubarb
          echo /tmp/pablo-rhubarb/Rhubarb-Lip-Sync-1.14.0-Linux >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1-fp32-studio-v1
      - name: Credenciais editoriais (secret/variável do repositório ou serviço do Render)
        # Depois que o banco inicial de roteiros acabar, o prepare precisa da OpenAI.
        env:
          SERVICO_RENDER: srv-daj08u7qj5pc73bpq7lg
          SECRET_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          VAR_MODELO: ${{ vars.PABLO_SCRIPT_MODEL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'FIM'
          import json, os, urllib.request
          chave = os.environ.get('SECRET_OPENAI', '')
          modelo = os.environ.get('VAR_MODELO', '')
          if not (chave and modelo) and os.environ.get('RENDER_API_KEY'):
              pedido = urllib.request.Request(
                  'https://api.render.com/v1/services/' + os.environ['SERVICO_RENDER'] + '/env-vars?limit=100',
                  headers={'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY'],
                           'Accept': 'application/json', 'User-Agent': 'pablo-guru-diario'})
              with urllib.request.urlopen(pedido, timeout=30) as resposta:
                  dados = {e['envVar']['key']: e['envVar']['value'] for e in json.load(resposta)}
              chave = chave or dados.get('OPENAI_API_KEY', '')
              modelo = modelo or dados.get('OPENAI_MODEL', '')
          with open(os.environ['GITHUB_ENV'], 'a') as arq:
              if chave:
                  print('::add-mask::' + chave)
                  arq.write('OPENAI_API_KEY=' + chave + '\n')
              if modelo:
                  arq.write('PABLO_SCRIPT_MODEL=' + modelo + '\n')
          print({'openai_key_present': bool(chave), 'script_model_configured': bool(modelo)})
          FIM
      - name: Verificar integrações sem expor valores
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m daily.preflight
      - name: Selecionar roteiro
        env:
          EPISODE_DATE: ${{ inputs.episode_date }}
          IS_TEST: ${{ github.event_name == 'push' || inputs.test == true }}
        run: |
          args=()
          if [ -n "$EPISODE_DATE" ]; then args+=(--date "$EPISODE_DATE"); fi
          if [ "$IS_TEST" = true ]; then args+=(--test); fi
          python -m daily.prepare "${args[@]}"
      - name: Preservar roteiro da data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.test == false)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if ! git diff --cached --quiet; then
            git commit -m "Registra roteiro diário [skip ci]"
            for tentativa in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$tentativa" = 5 ]; then exit 1; fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi
      - name: Gerar voz e renderizar
        run: |
          python -m daily.studio_adapter
          python -m daily.validate_video
      - name: Arquivar episódio
        uses: actions/upload-artifact@v4
        with:
          name: pablo-guru-diario-${{ github.run_id }}
          path: |
            output/Pablo_Guru_Diario.mp4
            output/episode.json
            output/caption.txt
            output/validation.json
            output/Pablo_Guru_Diario.production.json
            output/preview_*.jpg
            output/capa.png
            output/capa_ig.jpg
            output/metadados.json
            output/roteiro_studio.json
            output/integration_status.json
          if-no-files-found: error
          retention-days: 1
      - name: Resumo
        run: |
          python -c 'import json,os; e=json.load(open("output/episode.json")); v=json.load(open("output/validation.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("Episódio: "+e["title"]+"\n\nDuração: "+str(v["duration_seconds"])+" segundos. MP4 e legenda no artefato desta execução.\n")'