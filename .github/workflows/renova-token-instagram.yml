name: Renova token do Instagram

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar token e atualizar no Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-daj08u7qj5pc73bpq7lg
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          bruta = os.environ['RENDER_API_KEY']
          API = bruta.strip()
          print('Chave: ' + str(len(bruta)) + ' caracteres, ' + str(len(API)) + ' apos limpar, prefixo ' + API[:4])
          SVC = os.environ['RENDER_SERVICE_ID']
          BASE = 'https://api.render.com/v1'

          def abrir(req, onde):
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  detalhe = e.read().decode('utf-8', 'replace')[:400]
                  print('Falha em ' + onde + ': HTTP ' + str(e.code) + ' - ' + detalhe)
                  raise

          def render(caminho, metodo='GET', corpo=None):
              cabecalhos = {'Authorization': 'Bearer ' + API, 'Accept': 'application/json', 'User-Agent': 'pablo-guru-token-refresh'}
              dados = None
              if corpo is not None:
                  dados = json.dumps(corpo).encode()
                  cabecalhos['Content-Type'] = 'application/json'
              req = urllib.request.Request(BASE + caminho, data=dados, method=metodo, headers=cabecalhos)
              resposta = abrir(req, 'Render ' + metodo + ' ' + caminho)
              return json.loads(resposta) if resposta else {}

          lista = render('/services/' + SVC + '/env-vars')
          token = ''
          for item in lista:
              var = item.get('envVar', item)
              if var.get('key') == 'IG_ACCESS_TOKEN':
                  token = var.get('value', '')
          if not token:
              sys.exit('Nao encontrei IG_ACCESS_TOKEN nas variaveis do servico')
          print('Token atual lido do Render (' + str(len(token)) + ' caracteres).')

          url = 'https://graph.instagram.com/refresh_access_token?' + urllib.parse.urlencode({'grant_type': 'ig_refresh_token', 'access_token': token})
          try:
              novo = json.loads(abrir(urllib.request.Request(url, headers={'User-Agent': 'pablo-guru-token-refresh'}), 'Instagram refresh'))
          except urllib.error.HTTPError as e:
              if e.code == 400:
                  print('O Instagram recusou a renovacao agora. O caso mais comum e o token ter menos de 24 horas de vida; a proxima execucao mensal resolve.')
                  sys.exit(0)
              raise

          if not novo.get('access_token'):
              sys.exit('O Instagram nao devolveu token novo')

          dias = int(novo.get('expires_in', 0)) // 86400
          render('/services/' + SVC + '/env-vars/IG_ACCESS_TOKEN', 'PUT', {'value': novo['access_token']})
          render('/services/' + SVC + '/deploys', 'POST', {'clearCache': 'do_not_clear'})
          print('Token renovado e servico atualizado. Validade aproximada: ' + str(dias) + ' dias.')
          PY
