name: Métricas confirmadas de 24h e 72h
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: channel-metrics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Carregar credencial existente do canal
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'TOKEN'
          import json, os, urllib.request
          token = os.getenv('IG_ACCESS_TOKEN', '')
          if not token and os.getenv('RENDER_API_KEY'):
              req = urllib.request.Request('https://api.render.com/v1/services/srv-daj08u7qj5pc73bpq7lg/env-vars?limit=100', headers={'Authorization': 'Bearer '+os.environ['RENDER_API_KEY']})
              with urllib.request.urlopen(req, timeout=30) as response:
                  values = {v['envVar']['key']: v['envVar']['value'] for v in json.load(response)}
              token = values.get('IG_ACCESS_TOKEN', '')
          if token:
              print('::add-mask::'+token)
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('IG_ACCESS_TOKEN='+token+'\n')
          TOKEN
      - name: Coletar somente métricas de mídias confirmadas
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/channel_ops.py --account opabloguru
      - name: Preservar medições
        run: |
          [ -f data/channel_metrics.json ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/channel_metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'Métricas de publicações confirmadas [skip ci]'
          git pull --rebase && git push
