name: TikTok configuration and editorial test
on:
  push:
    branches: [main, feat/tiktok-five-daily]
    paths: ['tiktok_pipeline/**', '.github/workflows/tiktok*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tiktok_pipeline/tests -v
      # Em push só rodam os testes; a checagem de configuração (que gasta OpenAI) é manual.
      - name: Credenciais editoriais (repositório ou serviço do Render)
        if: github.event_name == 'workflow_dispatch'
        env:
          SERVICO_RENDER: srv-daj08u7qj5pc73bpq7lg
          SECRET_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          VAR_MODELO: ${{ vars.PABLO_SCRIPT_MODEL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'FIM'
          import json, os, urllib.request
          chave = os.environ.get('SECRET_OPENAI', '')
          modelo = os.environ.get('VAR_MODELO', '')
          if not (chave and modelo) and os.environ.get('RENDER_API_KEY'):
              pedido = urllib.request.Request(
                  'https://api.render.com/v1/services/' + os.environ['SERVICO_RENDER'] + '/env-vars?limit=100',
                  headers={'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY'],
                           'Accept': 'application/json', 'User-Agent': 'pablo-guru-tiktok-check'})
              with urllib.request.urlopen(pedido, timeout=30) as resposta:
                  dados = {e['envVar']['key']: e['envVar']['value'] for e in json.load(resposta)}
              chave = chave or dados.get('OPENAI_API_KEY', '')
              modelo = modelo or dados.get('OPENAI_MODEL', '')
          with open(os.environ['GITHUB_ENV'], 'a') as arq:
              if chave:
                  print('::add-mask::' + chave)
                  arq.write('OPENAI_API_KEY=' + chave + '\n')
              if modelo:
                  arq.write('PABLO_SCRIPT_MODEL=' + modelo + '\n')
          FIM
      - name: Configuration and original script
        if: github.event_name == 'workflow_dispatch'
        env:
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          TIKTOK_PUBLISH_ENABLED: ${{ vars.TIKTOK_PUBLISH_ENABLED }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from tiktok_pipeline.pipeline import prepare, identity
          from tiktok_pipeline.publish import credentials
          names = ['OPENAI_API_KEY','PABLO_SCRIPT_MODEL','TIKTOK_COOKIES_JSON']
          status = {name: bool(os.getenv(name)) for name in names}
          print(status)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              for name, present in status.items():
                  f.write(f'{name}: {"configurado" if present else "ausente"}\n\n')
          if not status['OPENAI_API_KEY'] or not status['PABLO_SCRIPT_MODEL']:
              raise RuntimeError('Geração original aguarda configuração editorial')
          key = identity(datetime.now(ZoneInfo('America/Sao_Paulo')).date().isoformat(), 1)
          item = prepare(key)
          print('Roteiro original validado:', item['episode']['title'])
          if status['TIKTOK_COOKIES_JSON']:
              credentials()
          else:
              print('Publicação pendente: sessão TikTok ausente.')
          PY