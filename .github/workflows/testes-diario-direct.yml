name: Testes Diario e Direct
on:
  push:
    branches: [main, implementacao/episodios-diarios-direct]
    paths: ['daily/**', 'direct_guru/**', 'tests/**', '.github/workflows/testes-diario-direct.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r direct_guru/requirements.txt
      - run: python -m unittest discover -s tests -v
