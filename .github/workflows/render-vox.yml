name: Render Pablo Guru VOX

on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: "Caminho do roteiro JSON (relativo à pasta do pipeline)"
        required: true
        default: "templates/roteiro_vox_teste_xicara.json"
      qualidade:
        description: "l (rascunho) | m | h (final)"
        required: true
        default: "h"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Achar a pasta do pipeline
        id: pasta
        run: |
          P=$(dirname "$(git ls-files | grep -m1 'pablo_episodio_vox.py$')")
          echo "dir=$P" >> "$GITHUB_OUTPUT"
          echo "Pipeline em: $P"

      - name: Dependências de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libcairo2-dev libpango1.0-dev \
               pkg-config cmake g++ libboost-dev fonts-dejavu-core
          # Poppins (legenda e colagem)
          mkdir -p ~/.fonts
          for f in Poppins-Bold Poppins-Regular; do
            curl -sL -o ~/.fonts/$f.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/$f.ttf"
          done
          fc-cache -f >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Python
        run: |
          python -m pip install -U pip setuptools wheel
          pip install manim kokoro-onnx soundfile pillow numpy

      - name: Cache Kokoro
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0

      - name: Baixar Kokoro (se faltar)
        run: |
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          REL=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do [ -s $f ] || curl -sL -o $f $REL/$f; done

      - name: Cache Rhubarb
        uses: actions/cache@v4
        with:
          path: /tmp/rls/build/rhubarb
          key: rhubarb-${{ runner.os }}-v1

      - name: Compilar Rhubarb (se faltar)
        run: |
          if [ ! -x /tmp/rls/build/rhubarb/rhubarb ]; then
            cd /tmp && rm -rf rls
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/DanielSWolf/rhubarb-lip-sync rls
            cd rls
            sed -i 's/^cmake_policy(SET CMP0167 OLD).*/if(POLICY CMP0167)\n  cmake_policy(SET CMP0167 OLD)\nendif()/' rhubarb/CMakeLists.txt
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release >/dev/null
            make -j"$(nproc)" rhubarb >/dev/null
          fi

      - name: Conferir compatibilidade
        working-directory: ${{ steps.pasta.outputs.dir }}
        run: python verificar_vox.py

      - name: Renderizar episódio VOX
        working-directory: ${{ steps.pasta.outputs.dir }}
        env:
          PABLO_PYTHON: python
        run: python pablo_episodio_vox.py "${{ inputs.roteiro }}" saida_vox "${{ inputs.qualidade }}"

      - name: Guardar o pacote (2 dias)
        uses: actions/upload-artifact@v4
        with:
          name: pablo-guru-vox
          retention-days: 2
          path: |
            ${{ steps.pasta.outputs.dir }}/saida_vox/**/*.mp4
            ${{ steps.pasta.outputs.dir }}/saida_vox/**/*.png
            ${{ steps.pasta.outputs.dir }}/saida_vox/**/*.json
            !${{ steps.pasta.outputs.dir }}/saida_vox/**/_tmp/**
